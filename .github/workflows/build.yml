name: Compilar Impara l'italiano
​on:
push:
branches: [ main ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: write
​steps:
- name: Descargar repositorio
uses: actions/checkout@v4
​- name: Configurar Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Descomprimir codigo y aplicar mejoras
run: |
unzip -o parlora_551_ligero.zip
if [ -d "overrides" ]; then
cp -rv overrides/* build551/src/com/germansilva/italianomaestro/
fi
​- name: Descargar APK base y llave fija desde Releases
env:
GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
run: |
gh release download Base --pattern "*.apk" -D .
if gh release download Base --pattern "impara.jks" -D . 2>/dev/null; then
echo "Llave fija cargada correctamente"
else
keytool -genkeypair -v -keystore impara.jks -alias impara -keyalg RSA -keysize 2048 -validity 10000 
-storepass android -keypass android -dname "CN=Impara,O=GermanSilva,C=HN"
gh release upload Base impara.jks
echo "Llave fija creada y guardada en Base"
fi
ls -lh *.apk impara.jks
​- name: Compilar Java
run: |
mkdir -p build551/deps build551/appclasses build551/dex
curl -sL -o build551/deps/json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-/android.jar | sort -V | tail -n 1)
find build551/src build551/supportsrc build551/stubs -name ".java" > build551/java-sources.txt
javac -nowarn 
-cp "build551/deps/json.jar:$ANDROID_JAR:build551/deps-extra/sherpa-api.jar" 
-d build551/appclasses @build551/java-sources.txt
​- name: Convertir a DEX y empaquetar APK
run: |
python3 - << 'EOF'
from pathlib import Path
import zipfile
​root = Path('build551')
families = {p.stem for p in (root/'src/com/germansilva/italianomaestro').glob('.java')}
with zipfile.ZipFile(root/'release.jar', 'w') as z:
for p in (root/'appclasses').rglob('.class'):
if p.stem.split('$')[0] in families:
z.write(p, str(p.relative_to(root/'appclasses')))
EOF
​BUILD_TOOLS=$(ls -1d "ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
ANDROID_JAR=(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
"$BUILD_TOOLS/d8" --min-api 31 --lib "$ANDROID_JAR" --output build551/dex build551/release.jar
​python3 - << 'EOF'
import zipfile, copy
from pathlib import Path
​dex_bytes = Path('build551/dex/classes.dex').read_bytes()
with zipfile.ZipFile('Parlora_5_51.apk', 'r') as old, zipfile.ZipFile('unsigned.apk', 'w') as out:
for item in old.infolist():
n = item.filename
if n.startswith('META-INF/'):
continue
if n == 'classes45.dex':
out.writestr(zipfile.ZipInfo('classes45.dex'), dex_bytes, compress_type=zipfile.ZIP_STORED)
else:
info = copy.copy(item)
out.writestr(info, old.read(n))
EOF
​"$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk
"$BUILD_TOOLS/apksigner" sign --ks impara.jks --ks-pass pass:android --key-pass pass:android 
--out Impara_l_italiano.apk aligned.apk
ls -lh Impara_l_italiano.apk
​- name: Subir nuevo APK
uses: actions/upload-artifact@v4
with:
name: Impara-Italiano-APK
path: Impara_l_italiano.apk
