name: "Compilar Impara l'italiano"
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Descomprimir codigo y aplicar mejoras
        run: |
          unzip -o parlora_551_ligero.zip
          mkdir -p build551/src/com/germansilva/italianomaestro
          cp -rv overrides/*.java build551/src/com/germansilva/italianomaestro/
          rm -f build551/src/com/germansilva/italianomaestro/ImparaExtras.java
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("build551/src/com/germansilva/italianomaestro/CompactSofia.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("new LinearLayout.LayoutParams(-1,a.dp(ChatSpace.AVATAR))", "new LinearLayout.LayoutParams(-1,a.dp(245))")
          old_add = "hero.addView(a.portrait,new FrameLayout.LayoutParams(-1,-1));"
          new_add = old_add + "if(a.portrait instanceof ViewGroup){ViewGroup pg=(ViewGroup)a.portrait;for(int k=0;k<pg.getChildCount();k++){View ch=pg.getChildAt(k);ch.setBackgroundColor(Color.TRANSPARENT);if(ch instanceof ImageView)ch.setVisibility(View.GONE);}}"
          s = s.replace(old_add, new_add)
          p.write_text(s, encoding="utf-8")
          EOF
      - name: Descargar APK base y llave fija
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release download Base --pattern "*.apk" -D . && (gh release download Base --pattern "impara.jks" -D . || (keytool -genkeypair -v -keystore impara.jks -alias impara -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Impara,O=GermanSilva,C=HN" && gh release upload Base impara.jks))
      - name: Compilar Java
        run: mkdir -p build551/deps build551/appclasses build551/dex && curl -sL -o build551/deps/json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar && ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1) && find build551/src build551/supportsrc build551/stubs -name "*.java" > build551/java-sources.txt && javac -nowarn -cp "build551/deps/json.jar:$ANDROID_JAR:build551/deps-extra/sherpa-api.jar" -d build551/appclasses @build551/java-sources.txt
      - name: Empaquetar y firmar APK
        run: |
          python3 -c "from pathlib import Path; import zipfile; root=Path('build551'); fam={p.stem for p in (root/'src/com/germansilva/italianomaestro').glob('*.java')}; z=zipfile.ZipFile(root/'release.jar','w'); [z.write(p,str(p.relative_to(root/'appclasses'))) for p in (root/'appclasses').rglob('*.class') if p.stem.split(chr(36))[0] in fam]; z.close()"
          BUILD_TOOLS=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
          "$BUILD_TOOLS/d8" --min-api 31 --lib "$ANDROID_JAR" --output build551/dex build551/release.jar
          python3 - << 'EOF'
          import zipfile, copy, re
          from pathlib import Path
          dex = Path("build551/dex/classes.dex").read_bytes()
          custom_glb = Path("overrides/sofia.glb")
          fondos_dir = Path("overrides/fondos")
          old = zipfile.ZipFile("Parlora_5_51.apk", "r")
          out = zipfile.ZipFile("unsigned.apk", "w")
          for it in old.infolist():
              if it.filename.startswith("META-INF/"):
                  continue
              if it.filename == "classes45.dex":
                  out.writestr(zipfile.ZipInfo("classes45.dex"), dex, compress_type=zipfile.ZIP_STORED)
              elif it.filename.startswith("assets/parlora/scenes546/") and (fondos_dir / Path(it.filename).name).exists():
                  out.writestr(copy.copy(it), (fondos_dir / Path(it.filename).name).read_bytes())
              elif it.filename == "assets/sofia84/avatar.glb" and custom_glb.exists():
                  out.writestr(copy.copy(it), custom_glb.read_bytes())
              elif it.filename == "assets/sofia84/index.html":
                  html = old.read(it.filename).decode("utf-8", "ignore")
                  html = html.replace("border-radius:22px;overflow:hidden;background:transparent", "border-radius:18px;overflow:hidden;background:transparent;transition:background .35s ease")
                  html = html.replace(".label{", ".label{display:none!important;")
                  bg_ui = (
                      "<button id='bgBtn' type='button' style='position:absolute;top:8px;right:8px;z-index:99;background:rgba(12,32,37,.78);color:#f3f1e8;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:5px 10px;font-size:11px;pointer-events:auto'>🖼 Sin fondo</button>"
                      "<script>(()=>{const st=document.getElementById('sofiaStage'),btn=document.getElementById('bgBtn');"
                      "const bgs=["
                      "{n:'Sin fondo',css:'transparent'},"
                      "{n:'Pizarra',css:'radial-gradient(circle at 50% 35%, #23473a 0%, #132821 75%, #0c1915 100%)'},"
                      "{n:'Biblioteca',css:'linear-gradient(160deg, #3b2618 0%, #1f140d 65%, #120b07 100%)'},"
                      "{n:'Roma',css:'linear-gradient(180deg, #3a4f7a 0%, #7d5a5a 55%, #241c24 100%)'},"
                      "{n:'Estudio',css:'radial-gradient(circle at 50% 25%, #243b55 0%, #141e30 85%)'}"
                      "];let idx=0;try{idx=+(localStorage.getItem('sofia_bg_idx')||0)%bgs.length;}catch(e){}"
                      "function apply(){st.style.background=bgs[idx].css;btn.textContent='🖼 '+bgs[idx].n;try{localStorage.setItem('sofia_bg_idx',idx);}catch(e){}}"
                      "btn.addEventListener('click',()=>{idx=(idx+1)%bgs.length;apply();});apply();})();</script></body>"
                  )
                  html = html.replace("</body>", bg_ui)
                  out.writestr(copy.copy(it), html.encode("utf-8"))
              elif it.filename == "assets/sofia84/character.js":
                  js = old.read(it.filename).decode("utf-8", "ignore")
                  js = js.replace(
                      "b.outputColorSpace=ft",
                      "b.outputColorSpace=ft,b.toneMapping=4,b.toneMappingExposure=1.08"
                  )
                  js = js.replace(
                      "let E=new li(0xfff3ea,1.9);E.position.set(-2,3.5,4);w.add(E);\nlet L=new li(0xdceaff,.75);L.position.set(3,1.7,3);w.add(L);\nlet rimLight=new li(0xe4efff,1.1);rimLight.position.set(1.5,2.5,-3);w.add(rimLight);",
                      "let E=new li(0xfff4e8,2.15);E.position.set(-2.2,3.2,4.2);w.add(E);\nlet L=new li(0xdbe8ff,.95);L.position.set(3.2,1.8,3.2);w.add(L);\nlet rimLight=new li(0xffe8d6,1.35);rimLight.position.set(1.4,2.6,-3.2);w.add(rimLight);"
                  )
                  js = js.replace(
                      '[["LeftArm",-1.15],["RightArm",1.15]]',
                      '[["LeftArm",-1.32],["RightArm",1.32]]'
                  )
                  js = js.replace(
                      "N.copy(Ze).add(new U(0,compact?-.06:.025,.025)),x.position.copy(N).add(new U(0,.025,compact?1.1:.87)),x.lookAt(N)",
                      "N.copy(Ze).add(new U(0,compact?-.06:-.13,.025)),x.position.copy(N).add(new U(0,.01,compact?1.1:1.65)),x.lookAt(N)"
                  )
                  if not custom_glb.exists():
                      outfit_patch = (
                          "if(/look/i.test(Ae.name)){"
                          "ie.roughnessMap=null;ie.metalnessMap=null;"
                          "ie.onBeforeCompile=Ne=>{Ne.fragmentShader=Ne.fragmentShader.replace('#include <map_fragment>',"
                          "'#include <map_fragment>\\nfloat lum=dot(diffuseColor.rgb,vec3(0.2126,0.7152,0.0722));\\n"
                          "vec3 blazerNavy=vec3(0.06,0.10,0.20)*(0.60+0.60*lum);\\n"
                          "vec3 blouseIvory=vec3(0.96,0.95,0.92)*(0.72+0.32*lum);\\n"
                          "diffuseColor.rgb=mix(blazerNavy,blouseIvory,smoothstep(0.45,0.62,lum));');};"
                          "ie.customProgramCacheKey=()=>'sofia-prof-v2';}"
                          "return ie.metalness=De?0:/look/i.test(Ae.name)?.03:.06,ie.roughness=eye?.14:skin?.48:q?.68:/look/i.test(Ae.name)?.82:.65,"
                      )
                      js = js.replace(
                          "return ie.metalness=De?0:.08,ie.roughness=eye?.18:skin?.55:q?.72:.65,",
                          outfit_patch
                      )
                  body_anim = (
                      "let Y=new wt,ne=new sn,_baInit=false,_ba={},_sp=0,_gIdx=0,_gNext=0,_cur={la:[0,0,0],ra:[0,0,0],lf:[0,0,0],rf:[0,0,0],lh:[0,0,0],rh:[0,0,0],sp:[0,0,0]};"
                      "const _POSES=["
                      "{la:[-0.10,0.04,0.02],ra:[-0.42,-0.16,-0.08],lf:[-0.36,-0.22,0],rf:[-0.95,0.42,0.18],lh:[0.05,0,0.10],rh:[-0.22,0.25,-0.38],sp:[0.02,-0.07,0.02]},"
                      "{la:[-0.44,0.16,0.08],ra:[-0.12,-0.04,-0.02],lf:[-0.92,-0.40,-0.16],rf:[-0.38,0.24,0],lh:[-0.20,-0.24,0.36],rh:[0.05,0,-0.10],sp:[0.02,0.07,-0.02]},"
                      "{la:[-0.36,0.22,0.12],ra:[-0.38,-0.22,-0.12],lf:[-0.78,-0.28,-0.12],rf:[-0.82,0.28,0.12],lh:[-0.18,-0.30,0.42],rh:[-0.18,0.30,-0.42],sp:[0.04,0,0]},"
                      "{la:[-0.22,0.08,0.03],ra:[-0.34,-0.10,-0.05],lf:[-0.65,-0.35,-0.08],rf:[-0.82,0.48,0.14],lh:[-0.10,-0.10,0.22],rh:[-0.15,0.18,-0.28],sp:[0.01,-0.04,0.03]},"
                      "{la:[-0.30,0.12,0.06],ra:[-0.20,-0.06,-0.03],lf:[-0.84,-0.46,-0.12],rf:[-0.58,0.32,0.06],lh:[-0.16,-0.18,0.30],rh:[-0.08,0.08,-0.18],sp:[0.03,0.05,-0.03]}"
                      "];"
                      "const _IDLE={la:[-0.08,0.04,0.02],ra:[-0.12,-0.05,-0.02],lf:[-0.34,-0.20,0],rf:[-0.42,0.25,0.04],lh:[0.04,0,0.08],rh:[0.02,0,-0.10],sp:[0,0.02,0]};"
                      "function _rotWorld(b,baseQ,ax,ay,az){"
                      "b.quaternion.copy(baseQ);b.updateMatrixWorld(true);"
                      "const pq=b.parent.getWorldQuaternion(new wt),wq=b.getWorldQuaternion(new wt);"
                      "const dw=new wt().setFromEuler(new sn(ax,ay,az,'YXZ'));"
                      "b.quaternion.copy(pq.invert().multiply(dw.multiply(wq)));"
                      "}"
                      "function _lerp3(c,tg,k){c[0]+=(tg[0]-c[0])*k;c[1]+=(tg[1]-c[1])*k;c[2]+=(tg[2]-c[2])*k;}"
                      "function _sofiaBodyAnim(){"
                      "if(!s)return;"
                      "if(!_baInit){_baInit=true;"
                      "for(const k of['Spine1','Spine2','LeftShoulder','RightShoulder','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftHand','RightHand']){const o=s.getObjectByName(k);if(o)_ba[k]={o,q:o.quaternion.clone()};}"
                      "s.traverse(o=>{if(!o.isBone)return;const n=o.name;"
                      "if(/Index1|Middle1|Ring1|Pinky1/.test(n))o.rotation.z+=(n.includes('Left')?0.28:-0.28);"
                      "if(/Index2|Middle2|Ring2|Pinky2/.test(n))o.rotation.z+=(n.includes('Left')?0.35:-0.35);"
                      "if(/Thumb1/.test(n))o.rotation.y+=(n.includes('Left')?-0.22:0.22);"
                      "});}"
                      "const tm=performance.now()*0.001,speaking=(t==='speaking');"
                      "_sp+=((speaking?1:0)-_sp)*0.06;"
                      "if(speaking&&tm>_gNext){_gIdx=(_gIdx+1+Math.floor(Math.random()*2))%_POSES.length;_gNext=tm+1.8+Math.random()*1.4;}"
                      "const tg=speaking?_POSES[_gIdx]:_IDLE;"
                      "const k=speaking?0.055:0.04;"
                      "_lerp3(_cur.la,tg.la,k);_lerp3(_cur.ra,tg.ra,k);_lerp3(_cur.lf,tg.lf,k);_lerp3(_cur.rf,tg.rf,k);_lerp3(_cur.lh,tg.lh,k);_lerp3(_cur.rh,tg.rh,k);_lerp3(_cur.sp,tg.sp,k);"
                      "const br=Math.sin(tm*1.4),beat=Math.sin(tm*3.1)*0.06*_sp,beat2=Math.cos(tm*2.4)*0.05*_sp;"
                      "if(_ba.Spine2)_rotWorld(_ba.Spine2.o,_ba.Spine2.q,_cur.sp[0]+0.02*br,_cur.sp[1]+0.025*Math.sin(tm*0.55),_cur.sp[2]+0.015*Math.sin(tm*0.8));"
                      "if(_ba.LeftShoulder)_rotWorld(_ba.LeftShoulder.o,_ba.LeftShoulder.q,0,0,0.025*br+beat*0.4);"
                      "if(_ba.RightShoulder)_rotWorld(_ba.RightShoulder.o,_ba.RightShoulder.q,0,0,-0.025*br-beat2*0.4);"
                      "if(_ba.LeftArm)_rotWorld(_ba.LeftArm.o,_ba.LeftArm.q,_cur.la[0]+beat,_cur.la[1]+beat2*0.5,_cur.la[2]+0.03*br);"
                      "if(_ba.RightArm)_rotWorld(_ba.RightArm.o,_ba.RightArm.q,_cur.ra[0]+beat2,_cur.ra[1]-beat*0.5,_cur.ra[2]-0.03*br);"
                      "if(_ba.LeftForeArm)_rotWorld(_ba.LeftForeArm.o,_ba.LeftForeArm.q,_cur.lf[0]+beat*1.4-0.03*br,_cur.lf[1]+beat2,_cur.lf[2]);"
                      "if(_ba.RightForeArm)_rotWorld(_ba.RightForeArm.o,_ba.RightForeArm.q,_cur.rf[0]+beat2*1.4-0.03*br,_cur.rf[1]-beat,_cur.rf[2]);"
                      "if(_ba.LeftHand)_rotWorld(_ba.LeftHand.o,_ba.LeftHand.q,_cur.lh[0]+beat*1.2,_cur.lh[1],_cur.lh[2]+beat2);"
                      "if(_ba.RightHand)_rotWorld(_ba.RightHand.o,_ba.RightHand.q,_cur.rh[0]+beat2*1.2,_cur.rh[1],_cur.rh[2]-beat);"
                      "const smile=0.20+0.06*Math.sin(tm*0.65)+_sp*0.14;const brow=0.06+0.05*Math.max(0,Math.sin(tm*0.85))+_sp*(0.24+0.16*Math.sin(tm*3.2));"
                      "D('mouthSmileLeft',smile);D('mouthSmileRight',smile);D('cheekSquintLeft',smile*0.45);D('cheekSquintRight',smile*0.45);"
                      "D('browInnerUp',brow);D('browOuterUpLeft',brow*0.65);D('browOuterUpRight',brow*0.65);"
                      "}"
                  )
                  js = js.replace("let Y=new wt,ne=new sn;", body_anim)
                  js = re.sub(r"b\.render\s*\(\s*w\s*,\s*x\s*\)", "(_sofiaBodyAnim(),b.render(w,x))", js)
                  out.writestr(copy.copy(it), js.encode("utf-8"))
              else:
                  out.writestr(copy.copy(it), old.read(it.filename))
          old.close()
          out.close()
          EOF
          "$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks impara.jks --ks-pass pass:android --key-pass pass:android --out Impara_l_italiano.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: {name: Impara-Italiano-APK, path: Impara_l_italiano.apk}
