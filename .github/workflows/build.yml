name: "Compilar Impara l'italiano"
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Descomprimir codigo y aplicar mejoras
        run: |
          unzip -o parlora_551_ligero.zip
          mkdir -p build551/src/com/germansilva/italianomaestro
          cp -rv overrides/*.java build551/src/com/germansilva/italianomaestro/
          rm -f build551/src/com/germansilva/italianomaestro/ImparaExtras.java
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("build551/src/com/germansilva/italianomaestro/CompactSofia.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("new LinearLayout.LayoutParams(-1,a.dp(ChatSpace.AVATAR))", "new LinearLayout.LayoutParams(-1,a.dp(240))")
          old_add = "hero.addView(a.portrait,new FrameLayout.LayoutParams(-1,-1));"
          new_add = old_add + "if(a.portrait instanceof ViewGroup){ViewGroup pg=(ViewGroup)a.portrait;for(int k=0;k<pg.getChildCount();k++){View ch=pg.getChildAt(k);ch.setBackgroundColor(Color.TRANSPARENT);if(ch instanceof ImageView)ch.setVisibility(View.GONE);}}"
          s = s.replace(old_add, new_add)
          p.write_text(s, encoding="utf-8")
          EOF
      - name: Descargar APK base y llave fija
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release download Base --pattern "*.apk" -D . && (gh release download Base --pattern "impara.jks" -D . || (keytool -genkeypair -v -keystore impara.jks -alias impara -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Impara,O=GermanSilva,C=HN" && gh release upload Base impara.jks))
      - name: Compilar Java
        run: mkdir -p build551/deps build551/appclasses build551/dex && curl -sL -o build551/deps/json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar && ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1) && find build551/src build551/supportsrc build551/stubs -name "*.java" > build551/java-sources.txt && javac -nowarn -cp "build551/deps/json.jar:$ANDROID_JAR:build551/deps-extra/sherpa-api.jar" -d build551/appclasses @build551/java-sources.txt
      - name: Empaquetar y firmar APK
        run: |
          python3 -c "from pathlib import Path; import zipfile; root=Path('build551'); fam={p.stem for p in (root/'src/com/germansilva/italianomaestro').glob('*.java')}; z=zipfile.ZipFile(root/'release.jar','w'); [z.write(p,str(p.relative_to(root/'appclasses'))) for p in (root/'appclasses').rglob('*.class') if p.stem.split(chr(36))[0] in fam]; z.close()"
          BUILD_TOOLS=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
          "$BUILD_TOOLS/d8" --min-api 31 --lib "$ANDROID_JAR" --output build551/dex build551/release.jar
          python3 - << 'EOF'
          import zipfile, copy, re
          from pathlib import Path
          dex = Path("build551/dex/classes.dex").read_bytes()
          custom_glb = Path("overrides/sofia.glb")
          fondos_dir = Path("overrides/fondos")
          old = zipfile.ZipFile("Parlora_5_51.apk", "r")
          out = zipfile.ZipFile("unsigned.apk", "w")
          for it in old.infolist():
              if it.filename.startswith("META-INF/"):
                  continue
              if it.filename == "classes45.dex":
                  out.writestr(zipfile.ZipInfo("classes45.dex"), dex, compress_type=zipfile.ZIP_STORED)
              elif it.filename.startswith("assets/parlora/scenes546/") and (fondos_dir / Path(it.filename).name).exists():
                  out.writestr(copy.copy(it), (fondos_dir / Path(it.filename).name).read_bytes())
              elif it.filename == "assets/sofia84/avatar.glb" and custom_glb.exists():
                  out.writestr(copy.copy(it), custom_glb.read_bytes())
              elif it.filename == "assets/sofia84/index.html":
                  html = old.read(it.filename).decode("utf-8", "ignore")
                  html = html.replace("border-radius:22px;overflow:hidden;background:transparent", "border-radius:18px;overflow:hidden;background:transparent;transition:background .35s ease")
                  html = html.replace(".label{", ".label{display:none!important;")
                  desk_and_bg = """
                  <div id="sofiaDeskWrap" style="position:absolute;left:0;right:0;bottom:0;height:23%;z-index:12;pointer-events:none;overflow:hidden;
                    background:
                      repeating-linear-gradient(90deg, rgba(255,220,185,0.03) 0px, rgba(255,220,185,0.03) 2px, transparent 2px, transparent 11px),
                      radial-gradient(ellipse at 50% 0%, rgba(255,215,170,0.22) 0%, rgba(0,0,0,0) 65%),
                      linear-gradient(180deg, #6e4527 0%, #52311a 16%, #3e2311 68%, #261409 86%, #180c05 100%);
                    border-top:1.5px solid rgba(210,160,110,0.55);
                    box-shadow:0 -10px 24px rgba(0,0,0,0.55), inset 0 2px 5px rgba(255,225,190,0.20);">
                    <div style="position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,#2c180b,#140a04);border-top:1px solid rgba(165,112,70,0.35);"></div>
                  </div>
                  <svg id="sofiaDeskProps" viewBox="0 0 420 130" preserveAspectRatio="xMidYMax meet" style="position:absolute;left:0;bottom:0;width:100%;height:50%;z-index:14;pointer-events:none;">
                    <defs>
                      <linearGradient id="pgL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f7f2e8"/><stop offset="85%" stop-color="#ece4d5"/><stop offset="100%" stop-color="#cfc3ae"/></linearGradient>
                      <linearGradient id="pgR" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d8ccb8"/><stop offset="18%" stop-color="#f5efe4"/><stop offset="100%" stop-color="#eae1d1"/></linearGradient>
                      <linearGradient id="phScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2b3a4a"/><stop offset="45%" stop-color="#111820"/><stop offset="100%" stop-color="#070a0e"/></linearGradient>
                      <linearGradient id="vaseG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b8aa99"/><stop offset="28%" stop-color="#f3ece1"/><stop offset="65%" stop-color="#d9cbb8"/><stop offset="100%" stop-color="#8b7c6b"/></linearGradient>
                      <radialGradient id="rose1" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#ffd6df"/><stop offset="55%" stop-color="#e35d7a"/><stop offset="100%" stop-color="#8f2440"/></radialGradient>
                      <radialGradient id="rose2" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#fff4e0"/><stop offset="60%" stop-color="#f2c48d"/><stop offset="100%" stop-color="#b5763a"/></radialGradient>
                    </defs>
                    <!-- Sombra suave de Sofia sobre el escritorio -->
                    <ellipse cx="210" cy="108" rx="95" ry="11" fill="rgba(10,5,2,0.42)"/>

                    <!-- IZQUIERDA: Cuaderno abierto en perspectiva -->
                    <g transform="translate(22,82)">
                      <polygon points="4,26 112,26 122,36 -4,36" fill="rgba(0,0,0,0.45)"/>
                      <polygon points="0,24 114,24 120,31 -6,31" fill="#1b3b36"/>
                      <polygon points="4,22 57,24 55,6 14,5" fill="url(#pgL)" stroke="#c7baa4" stroke-width="0.6"/>
                      <polygon points="57,24 111,22 101,5 55,6" fill="url(#pgR)" stroke="#c7baa4" stroke-width="0.6"/>
                      <line x1="18" y1="10" x2="49" y2="10.5" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <line x1="16" y1="14" x2="50" y2="14.5" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <line x1="14" y1="18" x2="44" y2="18.5" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <line x1="63" y1="10.5" x2="95" y2="10" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <line x1="63" y1="14.5" x2="97" y2="14" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <line x1="63" y1="18.5" x2="88" y2="18" stroke="#9aa3a8" stroke-width="0.7" opacity="0.75"/>
                      <path d="M56,24 L59,32 L54,30 Z" fill="#b83245"/>
                      <!-- Boligrafo sobre el cuaderno -->
                      <g transform="rotate(-12, 86, 16)">
                        <rect x="64" y="14" width="42" height="3.4" rx="1.7" fill="#1e2733"/>
                        <rect x="74" y="14" width="3" height="3.4" fill="#d4af37"/>
                        <polygon points="64,14.3 58,15.7 64,17.1" fill="#d4af37"/>
                      </g>
                    </g>

                    <!-- CENTRO-IZQUIERDA: Celular moderno sobre la mesa -->
                    <g transform="translate(148,96)">
                      <polygon points="6,14 48,14 53,21 1,21" fill="rgba(0,0,0,0.48)"/>
                      <polygon points="8,4 44,4 50,18 2,18" fill="#5e6873" stroke="#8a96a3" stroke-width="0.8"/>
                      <polygon points="10,5.5 42,5.5 47.5,16.5 4.5,16.5" fill="url(#phScr)"/>
                      <polygon points="12,6.5 25,6.5 16,15.5 7,15.5" fill="rgba(255,255,255,0.10)"/>
                      <rect x="22" y="10" width="9" height="1.4" rx="0.7" fill="rgba(120,210,255,0.45)"/>
                    </g>

                    <!-- DERECHA: Jarron de ceramica con flores y hojas -->
                    <g transform="translate(322,22)">
                      <ellipse cx="42" cy="92" rx="22" ry="6" fill="rgba(0,0,0,0.45)"/>
                      <!-- Tallos y hojas -->
                      <path d="M40,56 Q34,34 26,22" stroke="#2f5e36" stroke-width="2.2" fill="none"/>
                      <path d="M42,56 Q43,32 45,14" stroke="#2a5430" stroke-width="2.2" fill="none"/>
                      <path d="M44,56 Q52,36 60,25" stroke="#2f5e36" stroke-width="2.2" fill="none"/>
                      <ellipse cx="24" cy="36" rx="9" ry="4" transform="rotate(-32 24 36)" fill="#3b7543"/>
                      <ellipse cx="58" cy="39" rx="9" ry="4" transform="rotate(28 58 39)" fill="#34693b"/>
                      <ellipse cx="34" cy="28" rx="7" ry="3.2" transform="rotate(-55 34 28)" fill="#46874f"/>
                      <ellipse cx="50" cy="27" rx="7" ry="3.2" transform="rotate(48 50 27)" fill="#3d7a46"/>
                      <!-- Flores -->
                      <circle cx="25" cy="22" r="8.5" fill="url(#rose1)"/>
                      <circle cx="25" cy="21" r="4" fill="#ffb8c9" opacity="0.65"/>
                      <circle cx="45" cy="14" r="9.5" fill="url(#rose2)"/>
                      <circle cx="45" cy="13" r="4.5" fill="#fff7e6" opacity="0.75"/>
                      <circle cx="60" cy="25" r="8" fill="url(#rose1)"/>
                      <circle cx="60" cy="24" r="3.5" fill="#ffc2d1" opacity="0.65"/>
                      <circle cx="36" cy="20" r="5" fill="#fff0d4"/>
                      <!-- Cuerpo del jarron -->
                      <path d="M32,48 C32,54 24,62 24,75 C24,86 31,92 42,92 C53,92 60,86 60,75 C60,62 52,54 52,48 Z" fill="url(#vaseG)" stroke="#8c7d6b" stroke-width="0.7"/>
                      <ellipse cx="42" cy="48" rx="10" ry="3" fill="#cfc1ae" stroke="#8c7d6b" stroke-width="0.6"/>
                      <ellipse cx="42" cy="48" rx="7.5" ry="1.8" fill="#4f4337"/>
                      <path d="M31,64 C29,72 31,82 35,86" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" fill="none"/>
                    </g>
                  </svg>
                  <button id="bgBtn" type="button" style="position:absolute;top:8px;right:8px;z-index:99;background:rgba(12,32,37,.78);color:#f3f1e8;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:5px 10px;font-size:11px;pointer-events:auto">🖼 Biblioteca</button>
                  <script>(()=>{const st=document.getElementById('sofiaStage'),btn=document.getElementById('bgBtn');
                  const bgs=[
                  {n:'Biblioteca',css:'linear-gradient(160deg, #3b2618 0%, #1f140d 65%, #120b07 100%)'},
                  {n:'Pizarra',css:'radial-gradient(circle at 50% 35%, #23473a 0%, #132821 75%, #0c1915 100%)'},
                  {n:'Roma',css:'linear-gradient(180deg, #3a4f7a 0%, #7d5a5a 55%, #241c24 100%)'},
                  {n:'Estudio',css:'radial-gradient(circle at 50% 25%, #243b55 0%, #141e30 85%)'},
                  {n:'Sin fondo',css:'transparent'}
                  ];let idx=0;try{idx=+(localStorage.getItem('sofia_bg_idx')||0)%bgs.length;}catch(e){}
                  function apply(){st.style.background=bgs[idx].css;btn.textContent='🖼 '+bgs[idx].n;try{localStorage.setItem('sofia_bg_idx',idx);}catch(e){}}
                  btn.addEventListener('click',()=>{idx=(idx+1)%bgs.length;apply();});apply();})();</script></body>
                  """
                  html = html.replace("</body>", desk_and_bg)
                  out.writestr(copy.copy(it), html.encode("utf-8"))
              elif it.filename == "assets/sofia84/character.js":
                  js = old.read(it.filename).decode("utf-8", "ignore")
                  js = js.replace(
                      "b.outputColorSpace=ft",
                      "b.outputColorSpace=ft,b.toneMapping=4,b.toneMappingExposure=1.08"
                  )
                  js = js.replace(
                      "let E=new li(0xfff3ea,1.9);E.position.set(-2,3.5,4);w.add(E);\nlet L=new li(0xdceaff,.75);L.position.set(3,1.7,3);w.add(L);\nlet rimLight=new li(0xe4efff,1.1);rimLight.position.set(1.5,2.5,-3);w.add(rimLight);",
                      "let E=new li(0xfff4e8,2.15);E.position.set(-2.2,3.2,4.2);w.add(E);\nlet L=new li(0xdbe8ff,.95);L.position.set(3.2,1.8,3.2);w.add(L);\nlet rimLight=new li(0xffe8d6,1.35);rimLight.position.set(1.4,2.6,-3.2);w.add(rimLight);"
                  )
                  js = js.replace(
                      '[["LeftArm",-1.15],["RightArm",1.15]]',
                      '[["LeftArm",-1.26],["RightArm",1.26]]'
                  )
                  js = js.replace(
                      "N.copy(Ze).add(new U(0,compact?-.06:.025,.025)),x.position.copy(N).add(new U(0,.025,compact?1.1:.87)),x.lookAt(N)",
                      "N.copy(Ze).add(new U(0,compact?-.06:-.10,.025)),x.position.copy(N).add(new U(0,.01,compact?1.1:1.38)),x.lookAt(N)"
                  )
                  if not custom_glb.exists():
                      outfit_patch = (
                          "if(/look/i.test(Ae.name)){"
                          "ie.roughnessMap=null;ie.metalnessMap=null;"
                          "ie.onBeforeCompile=Ne=>{Ne.fragmentShader=Ne.fragmentShader.replace('#include <map_fragment>',"
                          "'#include <map_fragment>\\nfloat lum=dot(diffuseColor.rgb,vec3(0.2126,0.7152,0.0722));\\n"
                          "vec3 blazerNavy=vec3(0.06,0.10,0.20)*(0.60+0.60*lum);\\n"
                          "vec3 blouseIvory=vec3(0.96,0.95,0.92)*(0.72+0.32*lum);\\n"
                          "diffuseColor.rgb=mix(blazerNavy,blouseIvory,smoothstep(0.45,0.62,lum));');};"
                          "ie.customProgramCacheKey=()=>'sofia-prof-v2';}"
                          "return ie.metalness=De?0:/look/i.test(Ae.name)?.03:.06,ie.roughness=eye?.14:skin?.48:q?.68:/look/i.test(Ae.name)?.82:.65,"
                      )
                      js = js.replace(
                          "return ie.metalness=De?0:.08,ie.roughness=eye?.18:skin?.55:q?.72:.65,",
                          outfit_patch
                      )
                  body_anim = (
                      "let Y=new wt,ne=new sn,_baInit=false,_ba={},_vMesh=null,_vPulse=0;"
                      "function _rotWorld(b,baseQ,ax,ay,az){"
                      "b.quaternion.copy(baseQ);b.updateMatrixWorld(true);"
                      "const pq=b.parent.getWorldQuaternion(new wt),wq=b.getWorldQuaternion(new wt);"
                      "const dw=new wt().setFromEuler(new sn(ax,ay,az,'YXZ'));"
                      "b.quaternion.copy(pq.invert().multiply(dw.multiply(wq)));"
                      "}"
                      "function _sofiaBodyAnim(){"
                      "if(!s)return;"
                      "if(!_baInit){_baInit=true;"
                      "for(const k of['Spine2','LeftShoulder','RightShoulder','LeftArm','RightArm','LeftForeArm','RightForeArm']){const o=s.getObjectByName(k);if(o)_ba[k]={o,q:o.quaternion.clone()};}"
                      "_vMesh=c.find(m=>m.morphTargetDictionary&&m.morphTargetDictionary.viseme_aa!==void 0)||null;"
                      "if(_ba.LeftArm)_rotWorld(_ba.LeftArm.o,_ba.LeftArm.q,-0.22,0.08,0);"
                      "if(_ba.RightArm)_rotWorld(_ba.RightArm.o,_ba.RightArm.q,-0.22,-0.08,0);"
                      "if(_ba.LeftForeArm)_rotWorld(_ba.LeftForeArm.o,_ba.LeftForeArm.q,-0.55,-0.25,0);"
                      "if(_ba.RightForeArm)_rotWorld(_ba.RightForeArm.o,_ba.RightForeArm.q,-0.55,0.25,0);"
                      "}"
                      "const tm=performance.now()*0.001,speaking=(t==='speaking');"
                      "let mEnergy=0;if(speaking&&_vMesh){const dict=_vMesh.morphTargetDictionary,inf=_vMesh.morphTargetInfluences;for(const vn of z){const vi=dict[vn];if(vi!==void 0)mEnergy=Math.max(mEnergy,inf[vi]||0);}}"
                      "_vPulse+=(mEnergy-_vPulse)*(mEnergy>_vPulse?0.25:0.08);"
                      "const br=Math.sin(tm*1.25)*0.014;"
                      "if(_ba.Spine2)_rotWorld(_ba.Spine2.o,_ba.Spine2.q,br+(speaking?0.02:0),Math.sin(tm*0.45)*0.025,0);"
                      "if(_ba.LeftShoulder)_rotWorld(_ba.LeftShoulder.o,_ba.LeftShoulder.q,0,0,br*1.1);"
                      "if(_ba.RightShoulder)_rotWorld(_ba.RightShoulder.o,_ba.RightShoulder.q,0,0,-br*1.1);"
                      "const smile=0.18+(speaking?0.10+_vPulse*0.08:0);const brow=0.05+(speaking?_vPulse*0.26:0);"
                      "D('mouthSmileLeft',smile);D('mouthSmileRight',smile);D('cheekSquintLeft',smile*0.4);D('cheekSquintRight',smile*0.4);"
                      "D('browInnerUp',brow);D('browOuterUpLeft',brow*0.5);D('browOuterUpRight',brow*0.5);"
                      "}"
                  )
                  js = js.replace("let Y=new wt,ne=new sn;", body_anim)
                  js = re.sub(r"b\.render\s*\(\s*w\s*,\s*x\s*\)", "(_sofiaBodyAnim(),b.render(w,x))", js)
                  out.writestr(copy.copy(it), js.encode("utf-8"))
              else:
                  out.writestr(copy.copy(it), old.read(it.filename))
          old.close()
          out.close()
          EOF
          "$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks impara.jks --ks-pass pass:android --key-pass pass:android --out Impara_l_italiano.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: {name: Impara-Italiano-APK, path: Impara_l_italiano.apk}
