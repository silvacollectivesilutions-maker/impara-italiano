name: "Compilar Impara l'italiano"
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Descomprimir codigo y aplicar mejoras
        run: |
          unzip -o parlora_551_ligero.zip
          mkdir -p build551/src/com/germansilva/italianomaestro
          cp -rv overrides/*.java build551/src/com/germansilva/italianomaestro/
          rm -f build551/src/com/germansilva/italianomaestro/ImparaExtras.java
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("build551/src/com/germansilva/italianomaestro/CompactSofia.java")
          s = p.read_text(encoding="utf-8")
          s = s.replace("new LinearLayout.LayoutParams(-1,a.dp(ChatSpace.AVATAR))", "new LinearLayout.LayoutParams(-1,a.dp(245))")
          old_add = "hero.addView(a.portrait,new FrameLayout.LayoutParams(-1,-1));"
          new_add = old_add + "if(a.portrait instanceof ViewGroup){ViewGroup pg=(ViewGroup)a.portrait;for(int k=0;k<pg.getChildCount();k++){View ch=pg.getChildAt(k);ch.setBackgroundColor(Color.TRANSPARENT);if(ch instanceof ImageView)ch.setVisibility(View.GONE);}}"
          s = s.replace(old_add, new_add)
          p.write_text(s, encoding="utf-8")
          EOF
      - name: Descargar APK base y llave fija
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release download Base --pattern "*.apk" -D . && (gh release download Base --pattern "impara.jks" -D . || (keytool -genkeypair -v -keystore impara.jks -alias impara -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Impara,O=GermanSilva,C=HN" && gh release upload Base impara.jks))
      - name: Compilar Java
        run: mkdir -p build551/deps build551/appclasses build551/dex && curl -sL -o build551/deps/json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar && ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1) && find build551/src build551/supportsrc build551/stubs -name "*.java" > build551/java-sources.txt && javac -nowarn -cp "build551/deps/json.jar:$ANDROID_JAR:build551/deps-extra/sherpa-api.jar" -d build551/appclasses @build551/java-sources.txt
      - name: Empaquetar y firmar APK
        run: |
          python3 -c "from pathlib import Path; import zipfile; root=Path('build551'); fam={p.stem for p in (root/'src/com/germansilva/italianomaestro').glob('*.java')}; z=zipfile.ZipFile(root/'release.jar','w'); [z.write(p,str(p.relative_to(root/'appclasses'))) for p in (root/'appclasses').rglob('*.class') if p.stem.split(chr(36))[0] in fam]; z.close()"
          BUILD_TOOLS=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
          "$BUILD_TOOLS/d8" --min-api 31 --lib "$ANDROID_JAR" --output build551/dex build551/release.jar
          python3 - << 'EOF'
          import zipfile, copy, re
          from pathlib import Path
          dex = Path("build551/dex/classes.dex").read_bytes()
          custom_glb = Path("overrides/sofia.glb")
          fondos_dir = Path("overrides/fondos")
          old = zipfile.ZipFile("Parlora_5_51.apk", "r")
          out = zipfile.ZipFile("unsigned.apk", "w")
          for it in old.infolist():
              if it.filename.startswith("META-INF/"):
                  continue
              if it.filename == "classes45.dex":
                  out.writestr(zipfile.ZipInfo("classes45.dex"), dex, compress_type=zipfile.ZIP_STORED)
              elif it.filename.startswith("assets/parlora/scenes546/") and (fondos_dir / Path(it.filename).name).exists():
                  out.writestr(copy.copy(it), (fondos_dir / Path(it.filename).name).read_bytes())
              elif it.filename == "assets/sofia84/avatar.glb" and custom_glb.exists():
                  out.writestr(copy.copy(it), custom_glb.read_bytes())
              elif it.filename == "assets/sofia84/index.html":
                  html = old.read(it.filename).decode("utf-8", "ignore")
                  html = html.replace("border-radius:22px;overflow:hidden;background:transparent", "border-radius:18px;overflow:hidden;background:transparent;transition:background .35s ease")
                  html = html.replace(".label{", ".label{display:none!important;")
                  bg_ui = (
                      "<button id='bgBtn' title='Cambiar fondo' style='position:absolute;top:8px;right:8px;z-index:20;background:rgba(12,32,37,.65);color:#f3f1e8;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:4px 9px;font-size:11px;backdrop-filter:blur(6px)'>🖼 Fondo</button>"
                      "<script>(()=>{const st=document.getElementById('sofiaStage'),btn=document.getElementById('bgBtn');"
                      "const bgs=["
                      "{n:'Sin fondo',css:'transparent'},"
                      "{n:'Pizarra',css:'radial-gradient(circle at 50% 35%, #23473a 0%, #132821 75%, #0c1915 100%)'},"
                      "{n:'Biblioteca',css:'linear-gradient(160deg, #3b2618 0%, #1f140d 65%, #120b07 100%)'},"
                      "{n:'Roma',css:'linear-gradient(180deg, #3a4f7a 0%, #7d5a5a 55%, #241c24 100%)'},"
                      "{n:'Estudio',css:'radial-gradient(circle at 50% 25%, #243b55 0%, #141e30 85%)'}"
                      "];let idx=+(localStorage.getItem('sofia_bg_idx')||0)%bgs.length;"
                      "function apply(){st.style.background=bgs[idx].css;btn.textContent='🖼 '+bgs[idx].n;localStorage.setItem('sofia_bg_idx',idx);}"
                      "btn.onclick=()=>{idx=(idx+1)%bgs.length;apply();};apply();})();</script></body>"
                  )
                  html = html.replace("</body>", bg_ui)
                  out.writestr(copy.copy(it), html.encode("utf-8"))
              elif it.filename == "assets/sofia84/character.js":
                  js = old.read(it.filename).decode("utf-8", "ignore")
                  js = js.replace(
                      "let E=new li(0xfff3ea,1.9);E.position.set(-2,3.5,4);w.add(E);\nlet L=new li(0xdceaff,.75);L.position.set(3,1.7,3);w.add(L);\nlet rimLight=new li(0xe4efff,1.1);rimLight.position.set(1.5,2.5,-3);w.add(rimLight);",
                      "let E=new li(0xfff5eb,2.0);E.position.set(-2,3.5,4);w.add(E);\nlet L=new li(0xe8f1ff,.85);L.position.set(3,1.7,3);w.add(L);\nlet rimLight=new li(0xfff0dd,1.15);rimLight.position.set(1.5,2.5,-3);w.add(rimLight);"
                  )
                  js = js.replace(
                      "N.copy(Ze).add(new U(0,compact?-.06:.025,.025)),x.position.copy(N).add(new U(0,.025,compact?1.1:.87)),x.lookAt(N)",
                      "N.copy(Ze).add(new U(0,compact?-.06:-.13,.025)),x.position.copy(N).add(new U(0,.01,compact?1.1:1.65)),x.lookAt(N)"
                  )
                  if not custom_glb.exists():
                      outfit_patch = (
                          "if(/look/i.test(Ae.name)){"
                          "ie.roughnessMap=null;ie.metalnessMap=null;"
                          "ie.onBeforeCompile=Ne=>{Ne.fragmentShader=Ne.fragmentShader.replace('#include <map_fragment>',"
                          "'#include <map_fragment>\\nfloat lum=dot(diffuseColor.rgb,vec3(0.2126,0.7152,0.0722));\\n"
                          "vec3 blazerNavy=vec3(0.08,0.12,0.22)*(0.65+0.55*lum);\\n"
                          "vec3 blouseWhite=vec3(0.95,0.94,0.91)*(0.75+0.30*lum);\\n"
                          "diffuseColor.rgb=mix(blazerNavy,blouseWhite,smoothstep(0.45,0.62,lum));');};"
                          "ie.customProgramCacheKey=()=>'sofia-prof-v1';}"
                          "return ie.metalness=De?0:/look/i.test(Ae.name)?.04:.08,ie.roughness=eye?.18:skin?.55:q?.72:/look/i.test(Ae.name)?.78:.65,"
                      )
                      js = js.replace(
                          "return ie.metalness=De?0:.08,ie.roughness=eye?.18:skin?.55:q?.72:.65,",
                          outfit_patch
                      )
                  body_anim = (
                      "let Y=new wt,ne=new sn,_baInit=false,_ba={},_sp=0;"
                      "function _sofiaBodyAnim(){"
                      "if(!s)return;"
                      "if(!_baInit){_baInit=true;for(const k of['Spine1','Spine2','LeftShoulder','RightShoulder','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftHand','RightHand']){const o=s.getObjectByName(k);if(o)_ba[k]={o,q:o.quaternion.clone()};}}"
                      "const tm=performance.now()*0.001;_sp+=((t==='speaking'?1:0)-_sp)*0.08;const br=Math.sin(tm*1.6);"
                      "const set=(k,rx,ry,rz)=>{const d=_ba[k];if(!d)return;d.o.quaternion.copy(d.q).multiply(new wt().setFromEuler(new sn(rx,ry,rz)));};"
                      "set('Spine2',0.02*br+_sp*0.025*Math.sin(tm*2.2),0.035*Math.sin(tm*0.7)+_sp*0.045*Math.sin(tm*1.4),0.015*Math.sin(tm*0.9));"
                      "set('LeftShoulder',0,0,0.025*br);set('RightShoulder',0,0,-0.025*br);"
                      "set('LeftArm',-0.18-_sp*(0.30+0.14*Math.sin(tm*2.3)),0.10+_sp*0.12*Math.cos(tm*1.8),-0.10-_sp*0.08*Math.sin(tm*1.9));"
                      "set('RightArm',-0.18-_sp*(0.34+0.16*Math.cos(tm*2.1)),-0.10-_sp*0.12*Math.sin(tm*1.7),0.10+_sp*0.08*Math.cos(tm*1.6));"
                      "set('LeftForeArm',-0.36-0.04*br-_sp*(0.45+0.20*Math.sin(tm*2.7)),0.12+_sp*0.10*Math.cos(tm*2.1),0.12);"
                      "set('RightForeArm',-0.36-0.04*br-_sp*(0.48+0.22*Math.cos(tm*2.5)),-0.12-_sp*0.10*Math.sin(tm*2.3),-0.12);"
                      "set('LeftHand',-_sp*0.20*Math.sin(tm*3.1),_sp*0.12*Math.cos(tm*2.4),0);"
                      "set('RightHand',-_sp*0.20*Math.cos(tm*2.9),-_sp*0.12*Math.sin(tm*2.6),0);"
                      "}"
                  )
                  js = js.replace("let Y=new wt,ne=new sn;", body_anim)
                  js = re.sub(r"b\.render\s*\(\s*w\s*,\s*x\s*\)", "(_sofiaBodyAnim(),b.render(w,x))", js)
                  out.writestr(copy.copy(it), js.encode("utf-8"))
              else:
                  out.writestr(copy.copy(it), old.read(it.filename))
          old.close()
          out.close()
          EOF
          "$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks impara.jks --ks-pass pass:android --key-pass pass:android --out Impara_l_italiano.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: {name: Impara-Italiano-APK, path: Impara_l_italiano.apk}
